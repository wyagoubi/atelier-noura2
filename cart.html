<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="cart.title">سلة المشتريات — Atelier Noura</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 320px; gap: 30px; align-items: start; }
    .cart-item { display: grid; grid-template-columns: 80px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--color-beige); }
    .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); }
    .cart-item-meta { font-size: 0.85rem; color: var(--color-brown); }
    .qty-control { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .qty-control button { width: 28px; height: 28px; border: 1px solid var(--color-beige); background: var(--color-white); border-radius: var(--radius-sm); cursor: pointer; }
    .summary-box { background: var(--color-white); border: 1px solid var(--color-beige); border-radius: var(--radius-md); padding: 20px; position: sticky; top: 90px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.92rem; }
    @media (max-width: 860px) { .cart-layout { grid-template-columns: 1fr; } .summary-box { position: static; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container section">
    <h1 data-i18n="cart.title">سلة المشتريات</h1>
    <div id="cart-root"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/header-footer.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
