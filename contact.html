<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="nav.contact">تواصلي معنا — Atelier Noura</title>
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container section" style="max-width:600px;">
    <h1 data-i18n="nav.contact">تواصلي معنا</h1>
    <div id="contact-content" class="state-box"><div class="spinner"></div></div>
  </main>
  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/header-footer.js"></script>
  <script>
    async function loadContact() {
      const box = document.getElementById("contact-content");
      const { data, error } = await supabaseClient.from("store_settings").select("*").eq("id", 1).single();
      if (error || !data) return renderErrorState(box, t("common.error_generic"), loadContact);

      const rows = [];
      if (data.contact_phone) rows.push(`<p>📞 ${escapeHtml(data.contact_phone)}</p>`);
      if (data.contact_email) rows.push(`<p>✉️ ${escapeHtml(data.contact_email)}</p>`);
      if (data.facebook_url) rows.push(`<p><a href="${escapeHtml(data.facebook_url)}" target="_blank" rel="noopener">Facebook</a></p>`);
      if (data.instagram_url) rows.push(`<p><a href="${escapeHtml(data.instagram_url)}" target="_blank" rel="noopener">Instagram</a></p>`);

      box.innerHTML = rows.length ? rows.join("") : `<p>${t("common.no_results")}</p>`;
    }
    document.addEventListener("DOMContentLoaded", loadContact);
    document.addEventListener("languagechanged", loadContact);
  </script>
</body>
</html>
