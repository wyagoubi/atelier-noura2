<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="success.title">تم استلام الطلب — Atelier Noura</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container section" style="text-align:center; max-width:560px; margin-inline:auto;">
    <div style="font-size:3rem;">✓</div>
    <h1 data-i18n="success.title">شكرًا لكِ، تم استلام طلبك!</h1>
    <p><span data-i18n="success.order_number">رقم الطلب</span>: <strong id="order-number-display"></strong></p>
    <p id="order-total-display"></p>
    <p data-i18n="success.message">سنتواصل معك قريبًا لتأكيد الطلب.</p>
    <a href="index.html" class="btn btn-primary" data-i18n="success.back_home">العودة إلى الرئيسية</a>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/header-footer.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const order = params.get("order");
      const total = params.get("total");
      document.getElementById("order-number-display").textContent = order || "—";
      if (total) {
        document.getElementById("order-total-display").textContent = `${t("checkout.total")}: ${formatPrice(total)}`;
      }
      if (!order) window.location.href = "index.html";
    });
  </script>
</body>
</html>
