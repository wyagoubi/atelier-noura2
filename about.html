<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="nav.about">من نحن — Atelier Noura</title>
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container section" style="max-width:720px;">
    <h1 data-i18n="nav.about">من نحن</h1>
    <div id="about-content" class="state-box"><div class="spinner"></div></div>
  </main>
  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/header-footer.js"></script>
  <script>
    async function loadAbout() {
      const box = document.getElementById("about-content");
      const { data, error } = await supabaseClient.from("store_settings").select("*").eq("id", 1).single();
      if (error || !data) return renderErrorState(box, t("common.error_generic"), loadAbout);
      const text = localizedField(data, "about");
      box.innerHTML = text ? `<p>${escapeHtml(text)}</p>` : `<p>${t("common.no_results")}</p>`;
    }
    document.addEventListener("DOMContentLoaded", loadAbout);
    document.addEventListener("languagechanged", loadAbout);
  </script>
</body>
</html>
