<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="nav.faq">الأسئلة الشائعة — Atelier Noura</title>
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="container section" style="max-width:720px;">
    <h1 data-i18n="nav.faq">الأسئلة الشائعة</h1>
    <div id="faq-list" class="state-box"><div class="spinner"></div></div>
  </main>
  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/header-footer.js"></script>
  <script>
    async function loadFaqsPage() {
      const list = document.getElementById("faq-list");
      const { data, error } = await supabaseClient.from("faqs").select("*").eq("is_visible", true).order("sort_order");
      if (error) return renderErrorState(list, t("common.error_generic"), loadFaqsPage);
      if (!data || data.length === 0) return renderEmptyState(list);
      list.innerHTML = data.map((f) => `
        <details style="margin-bottom:12px; border-bottom:1px solid var(--color-beige); padding-bottom:12px;">
          <summary style="cursor:pointer; font-weight:600;">${escapeHtml(localizedField(f, "question"))}</summary>
          <p style="margin-top:8px;">${escapeHtml(localizedField(f, "answer"))}</p>
        </details>`).join("");
    }
    document.addEventListener("DOMContentLoaded", loadFaqsPage);
    document.addEventListener("languagechanged", loadFaqsPage);
  </script>
</body>
</html>
