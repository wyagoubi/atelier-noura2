<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المنتج — Atelier Noura</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .pd-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .pd-gallery-main { aspect-ratio: 1/1; border-radius: var(--radius-md); overflow: hidden; background: var(--color-beige); cursor: zoom-in; }
    .pd-gallery-main img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition-base); }
    .pd-gallery-main.zoomed img { transform: scale(1.7); cursor: zoom-out; }
    .pd-thumbs { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .pd-thumbs img { width: 68px; height: 68px; object-fit: cover; border-radius: var(--radius-sm); cursor: pointer; border: 2px solid transparent; }
    .pd-thumbs img.active { border-color: var(--color-brown); }
    .pd-price { font-size: 1.5rem; font-weight: 700; color: var(--color-brown); display:flex; gap:10px; align-items:baseline; }
    .pd-options { margin: 20px 0; }
    .swatch-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .swatch { padding: 8px 16px; border: 1px solid var(--color-beige); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.88rem; background: var(--color-white); }
    .swatch.active { border-color: var(--color-brown); background: var(--color-rose-light); }
    .qty-control { display: flex; align-items: center; gap: 10px; }
    .qty-control button { width: 36px; height: 36px; border: 1px solid var(--color-beige); background: var(--color-white); border-radius: var(--radius-sm); cursor: pointer; font-size: 1.1rem; }
    @media (max-width: 860px) { .pd-layout { grid-template-columns: 1fr; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container section" id="product-detail-root">
    <div class="state-box"><div class="spinner"></div></div>
  </main>

  <section class="section container">
    <div class="section-title"><h2 data-i18n="product.similar">منتجات مشابهة</h2></div>
    <div class="product-grid" id="similar-grid"></div>
  </section>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/header-footer.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>
